<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>Cobrinha · Arcádia</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="snake.css">
  <link rel="stylesheet" href="../../shared/game_ui.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html" aria-label="Voltar ao catálogo da Arcádia">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Catálogo</span>
    </a>
    <div class="game-id">
      <svg class="game-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="9" fill="#12261f"/>
        <path d="M7 22h9a4 4 0 0 0 0-8h-1a3 3 0 0 1 0-6h6" fill="none" stroke="#7ee08a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="24" cy="8" r="2" fill="#ff4f7b"/>
      </svg>
      <div class="game-text"><strong>Cobrinha</strong></div>
    </div>
  </header>

  <main id="arena" class="arena">
    <section class="hud" aria-label="Placar">
      <div class="stat stat-score">
        <span class="stat-label">PONTOS</span>
        <strong id="score" class="stat-value">0</strong>
      </div>
      <div id="best-card" class="stat stat-best">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
          <path d="M4 2h8v4a4 4 0 0 1-8 0zM4 3H1.5v1.5A2.5 2.5 0 0 0 4 7M12 3h2.5v1.5A2.5 2.5 0 0 1 12 7M8 10v3M5 14h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="stat-label">RECORDE</span>
        <strong id="best" class="stat-value">0</strong>
      </div>
      <div class="hud-actions">
        <button id="mute-button" class="tool" type="button" aria-pressed="false" aria-label="Silenciar efeitos sonoros" title="Som (M)">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M2 6h2.5L8 3v10L4.5 10H2z" fill="currentColor"/>
            <path class="icon-waves" d="M10.5 6a3 3 0 0 1 0 4M12.3 4.2a5.5 5.5 0 0 1 0 7.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path class="icon-cross" d="M10.5 6l4 4M14.5 6l-4 4" fill="none" stroke="#ff4f7b" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="pause-button" class="tool" type="button" aria-label="Pausar" title="Pausar (P)" disabled>
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="3.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="9.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </section>

    <div id="play" class="play">
      <div id="board" class="board is-ready" aria-label="Arena do Snake">
        <canvas id="game-canvas" aria-label="Área do jogo"></canvas>
        <p id="toast" class="toast" role="status"></p>

        <section class="screen screen-ready" aria-live="polite">
          <h1 class="title">Cobrinha</h1>
          <p class="menu-desc">Coma as frutinhas e cresça sem bater nas paredes nem em você mesma.</p>
          <ul class="menu-keys" aria-label="Comandos">
            <li><span class="keycaps"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span><span>mover</span></li>
            <li><span class="keycaps"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span><span>mover</span></li>
            <li><span class="keycaps"><kbd>P</kbd><kbd>Esc</kbd></span><span>pausar</span></li>
            <li><span class="keycaps"><kbd>M</kbd></span><span>som</span></li>
          </ul>
          <p class="menu-touch">Deslize no tabuleiro ou use os botões</p>
          <button id="start-button" class="btn" type="button">Jogar</button>
        </section>

        <section class="screen screen-paused" role="dialog" aria-labelledby="pause-title">
          <h2 id="pause-title" class="over-title">Pausado</h2>
          <button id="resume-button" class="btn" type="button">Continuar</button>
        </section>

        <section class="screen screen-over" role="dialog" aria-labelledby="over-title">
          <h2 id="over-title" class="over-title">Fim de jogo</h2>
          <p class="final"><span id="over-score">0</span><small>pontos</small></p>
          <p id="record-badge" class="badge" hidden>Novo recorde!</p>
          <button id="restart-button" class="btn" type="button">Jogar novamente</button>
        </section>
      </div>
    </div>

    <nav class="dpad" aria-label="Controles de toque">
      <button type="button" class="dir dir-up" data-dir="up" aria-label="Cima"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 13l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="dir dir-left" data-dir="left" aria-label="Esquerda"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="dir dir-down" data-dir="down" aria-label="Baixo"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="dir dir-right" data-dir="right" aria-label="Direita"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </nav>
  </main>

  <noscript><p class="noscript">Ative o JavaScript para jogar.</p></noscript>
  <script src="../../shared/game_storage.js"></script>
  <script src="../../shared/game_ui.js"></script>
  <script src="snake.js"></script>
</body>
</html>
