<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0820">
  <title>Stack Tower 2D · Arcádia</title>
  <link rel="stylesheet" href="stack_tower.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html" aria-label="Voltar ao catálogo da Arcádia">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Catálogo</span>
    </a>
    <div class="game-id">
      <span class="game-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <div class="game-text"><strong>Stack Tower 2D</strong><span>Arcade</span></div>
    </div>
    <p class="keys" aria-label="Controles">
      <span><kbd>Espaço</kbd> soltar</span>
      <span><kbd>P</kbd> pausa</span>
      <span><kbd>M</kbd> som</span>
    </p>
  </header>

  <div id="arena" class="arena">
    <main id="stage" class="stage is-ready" aria-label="Stack Tower 2D">

      <!-- Cenário e torre (mundo 288 x 512, escalado pelo JS) -->
      <div id="scene" class="scene" aria-hidden="true">
        <div class="sky"></div>
        <div class="night"></div>
        <div class="par stars" style="--k:.04"></div>
        <div class="par moon" style="--k:.08"></div>
        <div class="par clouds" style="--k:.16"><i class="cloud c1"></i><i class="cloud c2"></i><i class="cloud c3"></i></div>
        <div class="par mountains" style="--k:.3"></div>
        <div class="par skyline" style="--k:.55"></div>
        <div class="world">
          <div class="ground"></div>
          <div id="guide" class="guide"></div>
          <div id="tower" class="tower"></div>
          <div id="pad" class="pad"></div>
          <div id="fx" class="fx"></div>
        </div>
      </div>

      <!-- HUD -->
      <div class="hud">
        <div class="chip best-chip" title="Recorde">
          <span class="chip-head">
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 5l3 3 3-5 3 5 3-3-1 8H3z"/></svg>
            <span class="chip-label">Recorde</span>
          </span>
          <b id="best">0</b>
        </div>
        <div class="score-box" aria-live="polite">
          <div class="score-label">Pontos</div>
          <div id="score" class="score">0</div>
          <div id="toast" class="toast">Novo recorde!</div>
        </div>
        <div class="hud-btns">
          <button id="mute-button" class="icon-button" type="button" aria-pressed="false" aria-label="Silenciar sons" title="Som (M)">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M1 6h3l4-3v10l-4-3H1z"/>
              <g class="icon-waves" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
                <path d="M10.5 6.2a2.6 2.6 0 010 3.6"/><path d="M12.4 4.4a5.2 5.2 0 010 7.2"/>
              </g>
              <path class="icon-cross" d="M10.5 5.5l4 5m0-5l-4 5" fill="none" stroke="#ff6b7a" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="pause-button" class="icon-button" type="button" aria-label="Pausar" title="Pausar (P)">
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="3.5" y="2.5" width="3.2" height="11" rx="1" fill="currentColor"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>

      <section class="screen screen-ready" aria-live="polite">
        <div class="logo" aria-hidden="true"><i></i><i></i><i></i></div>
        <h1 class="title">Stack<br>Tower</h1>
        <p class="hint">Toque ou aperte espaço</p>
        <p class="controls">Solte o bloco no momento certo.<br>O que sobrar para fora é cortado.</p>
      </section>

      <section class="screen screen-paused" role="dialog" aria-labelledby="pause-title">
        <div class="card">
          <h2 id="pause-title" class="card-title">Pausado</h2>
          <button id="resume-button" class="btn" type="button">Continuar</button>
        </div>
      </section>

      <section class="screen screen-over" role="dialog" aria-labelledby="over-title">
        <div class="card">
          <h2 id="over-title" class="card-title">Fim de jogo</h2>
          <div id="record-badge" class="record-badge">★ Novo recorde! ★</div>
          <div class="stats">
            <div><span>Pontos</span><b id="over-score">0</b></div>
            <div><span>Recorde</span><b id="over-best">0</b></div>
          </div>
          <button id="restart-button" class="btn" type="button">Jogar novamente</button>
        </div>
      </section>

      <noscript><p class="noscript">Ative o JavaScript para jogar.</p></noscript>
    </main>
  </div>

  <script src="stack_tower.js"></script>
</body>
</html>
