<!-- flappy_bird/flappy_bird.html -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>Flappy Bird · Arcádia</title>
  <link rel="stylesheet" href="flappy_bird.css">
</head>
<body>

  <!-- Cabeçalho: voltar ao catálogo da Arcádia + identificação do jogo -->
  <header class="topbar">
    <a class="back" href="../index.html" aria-label="Voltar ao catálogo da Arcádia">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Catálogo</span>
    </a>

    <div class="game-id">
      <svg class="game-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="9" fill="#4ec0e8"/>
        <ellipse cx="14" cy="17" rx="8" ry="6.5" fill="#fbd530" stroke="#543847" stroke-width="2"/>
        <path d="M21 16h6l-1.5 3.5H21z" fill="#f45a1f" stroke="#543847" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="18.5" cy="14.5" r="2" fill="#fff" stroke="#543847" stroke-width="1.2"/>
      </svg>
      <div class="game-text">
        <strong>Flappy Bird</strong>
        <span>Arcade</span>
      </div>
    </div>

    <p class="keys" aria-label="Controles">
      <span><kbd>Espaço</kbd><kbd>&uarr;</kbd> voar</span>
      <span><kbd>M</kbd> som</span>
    </p>
  </header>

  <div id="arena" class="arena">
    <main id="stage" class="stage is-ready" aria-label="Flappy Bird">

      <!-- Todo o cenário, o pássaro, os canos e a pontuação são desenhados aqui -->
      <canvas id="game-canvas" aria-label="Área do jogo"></canvas>

      <!-- Liga/desliga os efeitos sonoros (atalho: tecla M) -->
      <button id="mute-button" class="icon-button" type="button"
              aria-pressed="false" aria-label="Silenciar efeitos sonoros" title="Som (M)">
        <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
          <path fill="#543847" d="M1 6h3l4-3v10l-4-3H1z"/>
          <g class="icon-waves" fill="#543847">
            <rect x="10" y="6" width="1" height="4"/>
            <rect x="12" y="4" width="1" height="8"/>
            <rect x="14" y="2" width="1" height="12"/>
          </g>
          <g class="icon-cross" fill="#e5432b">
            <rect x="10" y="5" width="2" height="2"/><rect x="12" y="7" width="2" height="2"/><rect x="14" y="9" width="2" height="2"/>
            <rect x="14" y="5" width="2" height="2"/><rect x="10" y="9" width="2" height="2"/>
          </g>
        </svg>
      </button>

      <!-- Tela inicial -->
      <section class="screen screen-ready" aria-live="polite">
        <h1 class="title"><span>Flappy</span><span>Bird</span></h1>
        <p id="ready-best" class="ready-best" hidden>Recorde: <strong id="ready-best-value">0</strong></p>
        <p class="hint">Toque ou pressione Espaço para começar</p>
        <p class="controls">Espaço, seta para cima, clique ou toque: voar</p>
      </section>

      <!-- Fim de partida -->
      <section id="over-screen" class="screen screen-over" role="dialog" aria-labelledby="over-title">
        <h2 id="over-title" class="over-title">Fim de jogo</h2>
        <div class="panel">
          <p id="over-new" class="badge" hidden>Novo recorde!</p>
          <dl class="panel-rows">
            <div class="panel-row"><dt>Pontos</dt><dd id="over-score">0</dd></div>
            <div class="panel-row"><dt>Recorde</dt><dd id="over-best">0</dd></div>
          </dl>
        </div>
        <button id="restart-button" class="btn" type="button">Jogar de novo</button>
        <p class="controls">Espaço ou toque na tela também reinicia</p>
      </section>

      <noscript><p class="noscript">Ative o JavaScript para jogar.</p></noscript>
    </main>
  </div>

  <script src="flappy_bird.js"></script>
</body>
</html>
