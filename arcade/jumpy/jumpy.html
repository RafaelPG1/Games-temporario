<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>Pula-Pula · Arcádia</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="jumpy.css">
  <link rel="stylesheet" href="../../shared/game_ui.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html" aria-label="Voltar ao catálogo da Arcádia">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Catálogo</span>
    </a>
    <div class="game-id">
      <svg class="game-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="9" fill="#4ec0e8"/>
        <rect x="9" y="8" width="14" height="14" fill="#ff6b57" stroke="#543847" stroke-width="2"/>
        <rect x="12" y="12" width="3" height="4" fill="#fff"/><rect x="18" y="12" width="3" height="4" fill="#fff"/>
        <rect x="6" y="25" width="20" height="3" fill="#74d160" stroke="#543847" stroke-width="1.5"/>
      </svg>
      <div class="game-text"><strong>Pula-Pula</strong></div>
    </div>
  </header>

  <div id="arena" class="arena">
    <main id="stage" class="stage is-ready" aria-label="Jumpy">
      <canvas id="game-canvas" aria-label="Área do jogo"></canvas>

      <button id="mute-button" class="icon-button" type="button" aria-pressed="false" aria-label="Silenciar efeitos sonoros" title="Som (M)">
        <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
          <path fill="#543847" d="M1 6h3l4-3v10l-4-3H1z"/>
          <g class="icon-waves" fill="#543847">
            <rect x="10" y="6" width="1" height="4"/><rect x="12" y="4" width="1" height="8"/><rect x="14" y="2" width="1" height="12"/>
          </g>
          <g class="icon-cross" fill="#e5432b">
            <rect x="10" y="5" width="2" height="2"/><rect x="12" y="7" width="2" height="2"/><rect x="14" y="9" width="2" height="2"/>
            <rect x="14" y="5" width="2" height="2"/><rect x="10" y="9" width="2" height="2"/>
          </g>
        </svg>
      </button>

      <button id="pause-button" class="icon-button" type="button" aria-label="Pausar" title="Pausar (P)">
        <svg viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
          <rect x="3" y="2" width="4" height="12" fill="#543847"/><rect x="9" y="2" width="4" height="12" fill="#543847"/>
        </svg>
      </button>

      <section class="screen screen-ready" aria-live="polite">
        <h1 class="title">Pula-Pula</h1>
        <p class="menu-desc">Salte de plataforma em plataforma e suba o mais alto que puder.</p>
        <ul class="menu-keys" aria-label="Comandos">
          <li><span class="keycaps"><kbd>←</kbd><kbd>→</kbd></span><span>mover</span></li>
          <li><span class="keycaps"><kbd>A</kbd><kbd>D</kbd></span><span>mover</span></li>
          <li><span class="keycaps"><kbd>P</kbd><kbd>Esc</kbd></span><span>pausar</span></li>
          <li><span class="keycaps"><kbd>M</kbd></span><span>som</span></li>
        </ul>
        <p class="menu-touch">Toque no lado esquerdo ou direito da tela</p>
        <button id="start-button" class="btn" type="button">Jogar</button>
      </section>

      <section class="screen screen-paused" role="dialog" aria-labelledby="pause-title">
        <h2 id="pause-title" class="over-title">Pausado</h2>
        <button id="resume-button" class="btn" type="button">Continuar</button>
      </section>

      <section class="screen screen-over" role="dialog" aria-labelledby="over-title">
        <h2 id="over-title" class="over-title">Game Over</h2>
        <p class="final">Score: <span id="over-score">0</span></p>
        <button id="restart-button" class="btn" type="button">Jogar novamente</button>
      </section>

      <noscript><p class="noscript">Ative o JavaScript para jogar.</p></noscript>
    </main>
  </div>

  <script src="../../shared/game_storage.js"></script>
  <script src="../../shared/game_ui.js"></script>
  <script src="jumpy.js"></script>
</body>
</html>
