<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>Campo Minado · Arcádia</title>
  <link rel="stylesheet" href="campo_minado.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../index.html" aria-label="Voltar ao catálogo da Arcádia">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
        <path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Catálogo</span>
    </a>
    <div class="game-id">
      <svg class="game-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="9" fill="#2c4150"/>
        <rect x="5" y="5" width="10" height="10" rx="2" fill="#5b7a8c"/><rect x="17" y="5" width="10" height="10" rx="2" fill="#161c29"/>
        <rect x="5" y="17" width="10" height="10" rx="2" fill="#161c29"/><rect x="17" y="17" width="10" height="10" rx="2" fill="#5b7a8c"/>
        <path d="M22 19v6" stroke="#eceef5" stroke-width="1.5" stroke-linecap="round"/><path d="M22.4 19.3l3.6 1.5-3.6 1.5z" fill="#ffc857"/>
        <circle cx="10" cy="22" r="2.4" fill="#ff5a4e"/>
      </svg>
      <div class="game-text"><h1>Campo Minado</h1><span>Lógica</span></div>
    </div>
    <p class="keys" aria-label="Controles">
      <span>botão direito: bandeira</span>
      <span><kbd>F</kbd> modo bandeira</span>
      <span><kbd>R</kbd> novo jogo</span>
    </p>
  </header>

  <div id="arena" class="arena">
    <main id="game" class="game" aria-label="Campo Minado">
      <div class="levels" role="radiogroup" aria-label="Dificuldade">
        <button type="button" role="radio" data-level="easy"><b>Fácil</b><i>9×9 · 10</i></button>
        <button type="button" role="radio" data-level="medium"><b>Médio</b><i>16×16 · 40</i></button>
        <button type="button" role="radio" data-level="hard"><b>Difícil</b><i>30×16 · 99</i></button>
      </div>

      <section class="hud" aria-label="Partida">
        <div class="stat"><span>Minas restantes</span><strong id="mines" aria-live="off">10</strong></div>
        <div class="stat"><span>Tempo</span><strong id="time">0:00</strong></div>
      </section>

      <div class="tools">
        <button id="flag-button" class="btn btn-alt" type="button" aria-pressed="false" title="Modo bandeira (F)">
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false"><path d="M4.5 2v12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M5 2.6l8 3.2-8 3.2z" fill="#ffc857"/><path d="M2.5 14.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>Bandeira</span>
        </button>
        <button id="new-button" class="btn" type="button" title="Novo jogo (R)">Novo jogo</button>
      </div>

      <div class="frame">
        <div id="field" class="field">
          <div id="grid" class="grid" role="grid" aria-label="Tabuleiro"></div>
        </div>
        <section id="end" class="end" role="dialog" aria-labelledby="end-title" hidden>
          <h2 id="end-title" class="end-title"></h2>
          <p id="end-text" class="end-text"></p>
          <button id="again-button" class="btn" type="button">Jogar de novo</button>
          <button id="view-button" class="btn btn-alt" type="button">Ver tabuleiro</button>
        </section>
      </div>
      <p id="status" class="status" aria-live="polite"></p>
      <noscript><p class="status">Ative o JavaScript para jogar.</p></noscript>
    </main>
  </div>
  <script src="campo_minado.js"></script>
</body>
</html>
