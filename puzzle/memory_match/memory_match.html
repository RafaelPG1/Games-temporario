<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07080c">
  <title>Jogo da Memória · Arcádia</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="memory_match.css">
  <link rel="stylesheet" href="../../shared/game_ui.css">
</head>
<body>
  <header class="topbar">
    <a class="back" href="../../index.html" aria-label="Voltar ao catálogo da Arcádia">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false"><path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Catálogo</span>
    </a>
    <div class="game-id">
      <svg class="game-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true" focusable="false">
        <rect width="32" height="32" rx="9" fill="#2b2d5b"/>
        <rect x="6" y="8" width="11" height="15" rx="2.5" fill="#fff4dc" transform="rotate(-10 11 15)"/>
        <rect x="15" y="9" width="11" height="15" rx="2.5" fill="#ff7a59" transform="rotate(8 20 16)"/>
      </svg>
      <div class="game-text"><strong>Jogo da Memória</strong></div>
    </div>
  </header>

  <main id="arena" class="arena">
    <section class="hud" aria-label="Placar">
      <div class="stat-score"><span class="label">PONTOS</span><strong id="score" class="value">0</strong></div>
      <div id="best-card" class="stat-best">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false"><path d="M4 2h8v4a4 4 0 0 1-8 0zM4 3H1.5v1.5A2.5 2.5 0 0 0 4 7M12 3h2.5v1.5A2.5 2.5 0 0 1 12 7M8 10v3M5 14h6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="label">RECORDE</span><strong id="best" class="value">0</strong>
      </div>
      <div class="hud-actions">
        <button id="mute-button" class="tool" type="button" aria-pressed="false" aria-label="Silenciar efeitos sonoros" title="Som (M)">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M2 6h2.5L8 3v10L4.5 10H2z" fill="currentColor"/><path class="icon-waves" d="M10.5 6a3 3 0 0 1 0 4M12.3 4.2a5.5 5.5 0 0 1 0 7.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="icon-cross" d="M10.5 6l4 4M14.5 6l-4 4" fill="none" stroke="#ff7a59" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="reset-button" class="tool" type="button" aria-label="Reiniciar partida" title="Reiniciar (R)">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="progress"><span>Tentativas <b id="attempts">0</b></span><span>Pares <b id="pairs">0/10</b></span><i id="bar" class="bar"></i></p>
    </section>

    <div id="play" class="play">
      <div id="board" class="board" aria-label="Cartas do jogo"></div>
      <p id="toast" class="toast" role="status"></p>
      <section id="win" class="win" role="dialog" aria-labelledby="win-title">
        <div classkw="win-card">
          <h2 id="win-title">Todos os pares!</h2>
          <p class="win-score"><span id="win-score">0</span><small>pontos</small></p>
          <p class="win-line">em <b id="win-attempts">0</b> tentativas</p>
          <p id="record-badge" class="badge" hidden>Novo recorde!</p>
          <button id="again-button" class="btn" type="button">Jogar novamente</button>
        </div>
      </section>
    </div>
  </main>
  <noscript><p class="noscript">Ative o JavaScript para jogar.</p></noscript>
  <div id="game-menu" class="gmenu" hidden role="dialog" aria-labelledby="gmenu-title">
  <div class="gmenu-card">
    <h2 id="gmenu-title" class="gmenu-title">Jogo da Memória</h2>
    <p class="menu-desc">Vire as cartas e encontre todos os pares com o menor número de tentativas.</p>
    <ul class="menu-keys" aria-label="Comandos">
      <li><span class="keycaps"><kbd>R</kbd></span><span>reiniciar</span></li>
      <li><span class="keycaps"><kbd>M</kbd></span><span>som</span></li>
    </ul>
    <p class="menu-touch">Toque nas cartas para virá-las</p>
    <button type="button" class="gmenu-play" data-menu-play>Jogar</button>
  </div>
</div>

  <script src="../../shared/game_storage.js"></script>
  <script src="../../shared/game_ui.js"></script>
  <script src="memory_match.js"></script>
</body>
</html>
