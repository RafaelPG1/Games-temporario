<!-- index.html - raiz do projeto -->

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcádia · Jogos de navegador</title>
<meta name="description" content="Biblioteca de jogos de navegador. Escolha uma categoria e jogue.">
<meta name="theme-color" content="#12102a">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" aria-label="Arcádia, início">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#ffc857"/><path d="M9 21V11l7 6 7-6v10" fill="none" stroke="#12102a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Arcádia</span>
  </a>
  <nav class="nav" aria-label="Principal">
    <a href="#catalogo">Jogos</a>
    <a href="#categorias">Categorias</a>
  </nav>
  <form class="search" role="search" onsubmit="return false">
    <label class="sr" for="busca">Pesquisar jogos</label>
    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m13.5 13.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <input id="busca" type="search" placeholder="Pesquisar jogos" autocomplete="off">
  </form>
</header>

<main>
  <div class="intro">
    <h1>Explore os jogos</h1>
    <p>Escolha uma categoria e comece a jogar.</p>
  </div>
  <div id="categorias" class="chips" role="group" aria-label="Categorias"></div>
  <p id="status" class="sr" aria-live="polite"></p>
  <section id="catalogo" class="grid" aria-label="Catálogo de jogos"></section>
</main>

<script src="script.js"></script>
</body>
</html>
